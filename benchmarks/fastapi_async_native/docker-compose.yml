version: '3.8'

services:
  fastapi_async_native:
    build:
      context: ..
      dockerfile: fastapi_async_native/Dockerfile
    container_name: benchmark_fastapi_async_native
    ports:
      - "8001:8001"
    environment:
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_DB: mongoengine_benchmark
      MONGODB_MAX_POOL_SIZE: 100
      MONGODB_MIN_POOL_SIZE: 10
      API_HOST: 0.0.0.0
      API_PORT: 8001
      ENABLE_METRICS: "true"
      LOG_LEVEL: INFO
    external_links:
      - benchmark_mongodb:mongodb
    volumes:
      - ./app:/app/app
      - ../shared:/app/shared
