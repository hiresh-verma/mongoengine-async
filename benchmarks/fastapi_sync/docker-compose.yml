version: '3.8'

services:
  mongodb:
    image: mongo:4.4
    container_name: benchmark_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: mongoengine_benchmark
    volumes:
      - mongodb_data:/data/db
    command: mongod --wiredTigerCacheSizeGB 2

  fastapi_sync:
    build:
      context: ../..
      dockerfile: benchmarks/fastapi_sync/Dockerfile
    container_name: benchmark_fastapi_sync
    ports:
      - "8000:8000"
    environment:
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_DB: mongoengine_benchmark
      MONGODB_MAX_POOL_SIZE: 100
      MONGODB_MIN_POOL_SIZE: 10
      API_HOST: 0.0.0.0
      API_PORT: 8000
      ENABLE_METRICS: "true"
      LOG_LEVEL: INFO
    depends_on:
      - mongodb
    volumes:
      - ./app:/app/app
      - ../shared:/app/shared

volumes:
  mongodb_data:
